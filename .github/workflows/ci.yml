name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Package contains no dependencies
        shell: bash
        run: node -e "const p=require('./package.json'); if (Object.keys(p.dependencies||{}).length) { console.error('runtime dependencies are not allowed'); process.exit(1) }"
